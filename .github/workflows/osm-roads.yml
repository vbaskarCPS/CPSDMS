# Map Builder roads without the Overpass servers: download OpenStreetMap's BC extract (Geofabrik, free, ODbL),
# keep the roads the builder uses inside each area box, and publish them as one small JSON file per 0.02° square on
# the osm-roads-data branch. The database's road pre-load job reads those files into the builder's road cache.
name: OSM roads for the Map Builder
on:
  push:
    branches: [osm-roads]
    paths: ['.github/workflows/osm-roads.yml', 'scripts/osm_roads.py']
permissions:
  contents: write
jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # west,south,east,north — whole 0.02° squares (Surrey and White Rock)
      BOXES: "-122.94,49.00,-122.66,49.24"
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: BC extract
        run: curl -sSfL -o bc.osm.pbf https://download.geofabrik.de/north-america/canada/british-columbia-latest.osm.pbf && ls -la bc.osm.pbf
      - name: Roads in the boxes
        run: |
          echo '{"linear_tags": true, "area_tags": false}' > export.json
          mkdir -p out
          for b in $BOXES; do
            osmium extract -b "$b" -s complete_ways bc.osm.pbf -o area.pbf --overwrite
            osmium tags-filter area.pbf w/highway -o roads.pbf --overwrite
            osmium export roads.pbf -c export.json -f geojsonseq -a id -o roads.geojsonseq --overwrite
            python3 scripts/osm_roads.py roads.geojsonseq "$b" out
          done
          ls out | wc -l
      - name: Publish
        run: |
          git config user.name "osm-roads bot"
          git config user.email "osm-roads@users.noreply.github.com"
          git fetch origin osm-roads-data || true
          git checkout --orphan data
          git rm -rq --cached . || true
          mkdir -p roads && cp out/*.json roads/
          printf 'Road data © OpenStreetMap contributors, ODbL (openstreetmap.org/copyright). One file per 0.02° square, for the Map Builder road cache.\n' > roads/README.txt
          git add roads
          git commit -qm "OSM roads $(date -u +%F)"
          git push -f origin HEAD:osm-roads-data

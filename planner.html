<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- One page, two apps: the path picks the identity (Vijay at /vijayplanner, Rosh at /roshplanner).
         The static tags below are Vijay's, as the fallback; this runs before the manifest link exists. -->
    <script>
      (function () {
        var rosh = /^\/roshplanner(\/|$)/.test(location.pathname), demo = /^\/demo(\/|$)/.test(location.pathname);
        var app = rosh ? 'roshplanner' : 'vijayplanner';
        var name = demo ? 'Planner demo' : rosh ? 'Rosh Planner' : 'Vijay Planner', short = rosh ? 'Rosh' : 'Planner', color = rosh ? '#3b1f5e' : '#101c3a';
        document.documentElement.dataset.theme = rosh ? 'plum' : 'navy';
        document.title = name;
        function tag(t, attrs) { var e = document.createElement(t); for (var k in attrs) e.setAttribute(k, attrs[k]); document.head.appendChild(e); }
        if (!demo) tag('link', { rel: 'manifest', href: '/' + app + '/manifest.json' });
        tag('link', { rel: 'icon', type: 'image/svg+xml', href: '/' + app + '/logo.svg' });
        tag('link', { rel: 'apple-touch-icon', href: '/' + app + '/icon-192.png' });
        tag('meta', { name: 'theme-color', content: color });
        tag('meta', { name: 'apple-mobile-web-app-title', content: short });
        tag('meta', { name: 'description', content: name });
        // A look chosen in the Theme Studio: its page colour goes on now, before anything is drawn, so the planner
        // never opens in its old colours for a moment. What to use was left by the app the last time it ran
        // (features/look/store.ts), by section; the app puts on the rest of the look as it starts.
        try {
          var pass = demo ? null : JSON.parse(localStorage.getItem(rosh ? 'roshplanner-pass' : 'vijay-planner-pass') || 'null');
          var first = pass && pass.user ? JSON.parse(localStorage.getItem('planner-look-first:' + pass.user.id) || 'null') : null;
          if (first) {
            var part = location.pathname.split('/').filter(Boolean)[1] || '';
            var look = first.sections && Object.prototype.hasOwnProperty.call(first.sections, part) ? first.sections[part] : first.all;
            if (look && /^#[0-9a-f]{6}$/i.test(look.bg)) {
              var page = document.documentElement.style;
              page.setProperty('--bg', look.bg);
              page.setProperty('background-color', look.bg);   // in case this runs before the stylesheet is in
              page.setProperty('color-scheme', look.scheme === 'dark' ? 'dark' : 'light');
            }
          }
        } catch (e) { /* nothing remembered: the planner's own colours */ }
      })();
    </script>
    <noscript>
      <link rel="manifest" href="/vijayplanner/manifest.json" />
      <link rel="icon" type="image/png" href="/vijayplanner/icon-192.png" />
      <link rel="apple-touch-icon" href="/vijayplanner/icon-192.png" />
      <meta name="theme-color" content="#101c3a" />
    </noscript>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Vijay Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/planner/main.tsx"></script>
  </body>
</html>
